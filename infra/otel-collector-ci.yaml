# CI-only disposable OTLP/gRPC collector; no production endpoint, credentials or retention.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
exporters:
  debug:
    verbosity: detailed
    sampling_initial: 100
    sampling_thereafter: 1
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
