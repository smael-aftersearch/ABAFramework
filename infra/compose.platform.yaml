# Local-only integration dependencies. Never expose these demo credentials publicly.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aba_platform
      POSTGRES_USER: aba_dev
      POSTGRES_PASSWORD: aba_dev_local_only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aba_dev -d aba_platform"]
      interval: 3s
      retries: 30
    volumes:
      - aba-postgres:/var/lib/postgresql/data
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Aba_CiOnly_2026!"
    ports:
      - "127.0.0.1:14339:1433"
    volumes:
      - aba-sqlserver:/var/opt/mssql
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6389:6379"
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aba_dev
      RABBITMQ_DEFAULT_PASS: aba_dev_local_only
    ports:
      - "127.0.0.1:56729:5672"
    labels:
      aba.test.disposable: "true"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:9092:9092"
    labels:
      aba.test.disposable: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      retries: 30
volumes:
  aba-postgres:
  aba-sqlserver:
