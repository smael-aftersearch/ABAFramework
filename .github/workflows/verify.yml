name: Verify ABA Framework and Generic API
on:
  push:
  pull_request:
jobs:
  governance-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release verifier binding, valid identity and negative attestations
        run: |
          python3 scripts/test_workflow_attestation_auth.py
          python3 scripts/test_release_attestation.py
      - name: Verify implementation status catalog, task backlog and evidence links
        run: |
          python3 scripts/status_matrix.py --write
          git diff --exit-code -- README.md docs/IMPLEMENTATION-STATUS.md
          python3 scripts/test_status_matrix.py
          python3 scripts/status_matrix.py --check
      - name: Reject unsafe shared quota process fixtures
        run: python3 scripts/test_shared_rate_limit_processes.py
      - name: Prove CI-only collector opt-in refuses unsafe execution
        run: python3 scripts/test_otel_collector_gate.py
      - name: Prove bounded loopback load happy/negative/security invariants
        run: python3 scripts/test_ci_loopback_load.py
      - name: Regressions for AI planner/QA runner
        run: python3 scripts/test_task_protocol.py
      - name: Recorded QA gates (includes architecture, AI checks, .NET build and C# smoke)
        run: |
          python3 scripts/task_protocol.py verify --profile all \
            --output artifacts/verification/ci.json \
            --markdown artifacts/verification/ci.md
      - name: Prove development HTTP host starts and completes API demo
        run: bash scripts/verify-http.sh
      - name: Reject OCI base-image drift and negative policy fixtures
        run: |
          python3 templates/aba-api/tools/test_oci_base_lock.py
          python3 templates/aba-api/tools/oci_base_lock.py --root templates/aba-api
      - name: Validate generic starter template metadata
        run: python3 scripts/test_starter_template.py
      - name: Generate, build, test and start a clean generic API
        run: bash scripts/verify-starter.sh
      - name: Upload QA evidence (including failed/incomplete runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-verification-evidence
          path: artifacts/verification/
          if-no-files-found: warn

  integration-relational-and-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aba_ci
          POSTGRES_USER: aba_ci
          POSTGRES_PASSWORD: aba-ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aba_ci -d aba_ci"
          --health-interval 3s --health-timeout 3s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Aba_CiOnly_2026!"
        ports:
          - 1433:1433
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: aba_ci
          RABBITMQ_DEFAULT_PASS: aba-ci-local-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
          --label aba.test.disposable=true
      kafka:
        image: apache/kafka:4.4.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        ports:
          - 9092:9092
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --label aba.test.disposable=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify real PostgreSQL, SQL Server, Redis, RabbitMQ and Kafka with generated project
        env:
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_SQLSERVER: "Server=localhost,1433;Database=aba_ci;User Id=sa;Password=Aba_CiOnly_2026!;TrustServerCertificate=True"
          ABA_TEST_REDIS: "localhost:6379,abortConnect=false"
          ABA_TEST_RABBITMQ: "amqp://aba_ci:aba-ci-local-only@localhost:5672/%2F"
          ABA_TEST_KAFKA: "localhost:9092"
          ABA_ENABLE_SHARED_RATE_LIMIT_PROCESS_DRILL: "yes"
          ABA_ENABLE_DESTRUCTIVE_CI_DRILLS: "yes"
        run: |
          bash scripts/verify-platform-services.sh

      - name: Verify RabbitMQ outage and durable outbox recovery
        env:
          CI: "true"
          ABA_ENABLE_BROKER_OUTAGE_DRILL: "yes"
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_RABBITMQ: "amqp://aba_ci:aba-ci-local-only@localhost:5672/%2F"
          ABA_TEST_RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          dotnet test templates/aba-api/tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --filter 'Category=BrokerOutageDrill' \
            --logger 'console;verbosity=normal'

  redis-restart:
    # Isolated from the relational/Redis integration job so stopping this CI
    # Redis service cannot disrupt concurrent database/Wolverine assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stop and restart ONLY the explicitly provisioned CI Redis container
        env:
          CI: "true"
          ABA_ENABLE_REDIS_RESTART_DRILL: "yes"
          ABA_TEST_REDIS: "localhost:6379,abortConnect=false"
          ABA_TEST_REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          dotnet test templates/aba-api/tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --filter 'Category=RedisRestartDrill' \
            --logger 'console;verbosity=normal'

  container-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run fresh generic API Docker image
        run: bash scripts/verify-container-starter.sh

  package-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack and install versioned .NET template package
        run: bash scripts/pack-template.sh
      - name: Upload installable NuGet template package
        uses: actions/upload-artifact@v4
        with:
          name: aba-dotnet-template-nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  keycloak-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real Keycloak OIDC, JWKS and tenant 204/401/403
        run: bash scripts/verify-keycloak-oidc.sh

  otel-collector:
    # CI-only no-secrets loopback receiver; no production telemetry destination.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prove genuine generated API OTLP/gRPC spans and metrics
        env:
          CI: "true"
          ABA_ENABLE_OTEL_COLLECTOR_DRILL: "yes"
        run: bash scripts/verify-otel-collector.sh
      - name: Preserve bounded disposable loopback baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-loopback-load-baseline
          path: artifacts/load/loopback.json
          if-no-files-found: warn

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Supply-chain positive and deliberately failing test cases
        run: python3 templates/aba-api/tools/test_supply_chain.py
      - name: Fail closed on NuGet advisories and inventory the restored solution
        run: |
          dotnet restore templates/aba-api/Aba.Starter.slnx
          mkdir -p templates/aba-api/artifacts/supply-chain
          dotnet package list --project templates/aba-api/Aba.Starter.slnx \
            --include-transitive --vulnerable --format json --output-version 1 --no-restore \
            > templates/aba-api/artifacts/supply-chain/audit.json
          python3 templates/aba-api/tools/supply_chain.py \
            --root templates/aba-api --solution templates/aba-api/Aba.Starter.slnx \
            --audit-json templates/aba-api/artifacts/supply-chain/audit.json \
            --output templates/aba-api/artifacts/supply-chain/sbom.spdx.json
      - name: Scan the separate real-service integration test project
        run: |
          dotnet restore templates/aba-api/tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj
          dotnet package list --project templates/aba-api/tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            --include-transitive --vulnerable --format json --output-version 1 --no-restore \
            > templates/aba-api/artifacts/supply-chain/integration-audit.json
          python3 templates/aba-api/tools/supply_chain.py --root templates/aba-api \
            --project templates/aba-api/tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            --audit-json templates/aba-api/artifacts/supply-chain/integration-audit.json \
            --output templates/aba-api/artifacts/supply-chain/integration.spdx.json
      - name: Preserve NuGet audit and SPDX package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-nuget-supply-chain-evidence
          path: templates/aba-api/artifacts/supply-chain/
          if-no-files-found: warn


  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on an unreviewed SDK/runtime OCI base
        run: python3 templates/aba-api/tools/oci_base_lock.py --root templates/aba-api
      - name: Resolve trusted upstream base image index digests for reviewed pinning
        run: |
          mkdir -p artifacts/container
          for ref in mcr.microsoft.com/dotnet/sdk:10.0-noble mcr.microsoft.com/dotnet/aspnet:10.0-noble; do
            echo "$ref" | tee -a artifacts/container/base-image-index-digests.txt
            docker buildx imagetools inspect "$ref" | grep '^Digest:' | tee -a artifacts/container/base-image-index-digests.txt
          done
      - name: Build the exact domain-neutral runtime image
        run: |
          mkdir -p artifacts/container
          docker build --pull -t aba-ci-security:local templates/aba-api
          docker image inspect --format '{{.Id}}' aba-ci-security:local \
            > artifacts/container/built-image-id.txt
      - name: Fail on fixable CRITICAL runtime image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aba-ci-security:local
          vuln-type: os,library
          format: json
          output: artifacts/container/trivy.json
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
      - name: Export the *scanned* OCI image and prove Docker load identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save aba-ci-security:local | gzip -1 > artifacts/container/aba-runtime-image.tar.gz
          cd artifacts/container
          sha256sum aba-runtime-image.tar.gz > image-archive-sha256.txt
          sha256sum --check image-archive-sha256.txt
          original="$(cat built-image-id.txt)"
          docker image rm aba-ci-security:local >/dev/null
          docker load -i aba-runtime-image.tar.gz
          restored="$(docker image inspect --format '{{.Id}}' aba-ci-security:local)"
          test "$original" = "$restored"
          echo "PASS: scanned image recovered from the exact archive that will be signed"
      - name: Retain real image vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-runtime-image-security
          path: artifacts/container/
          if-no-files-found: warn

  template-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - governance-and-runtime
      - integration-relational-and-redis
      - redis-restart
      - container-startup
      - package-template
      - keycloak-oidc
      - otel-collector
      - supply-chain
      - container-security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aba-dotnet-template-nupkg
          path: artifacts/provenance
      - name: Record SHA256 digest of tested NuGet template artifact
        run: |
          cd artifacts/provenance
          sha256sum *.nupkg > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Sign keyless SLSA build provenance with GitHub Actions identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/provenance/*.nupkg
      - name: Verify NuGet signature, source commit and tamper rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE="$(find artifacts/provenance -maxdepth 1 -name '*.nupkg' -type f -print -quit)"
          test -n "$PACKAGE"
          bash scripts/verify_attested_artifact.sh "$PACKAGE" artifacts/provenance/verified-attestation.json
      - name: Download scanned Docker archive after all eight prerequisite jobs passed
        uses: actions/download-artifact@v4
        with:
          name: aba-runtime-image-security
          path: artifacts/oci-provenance
      - name: Verify scanned Docker archive digest and recovered runtime identity
        run: |
          set -euo pipefail
          cd artifacts/oci-provenance
          sha256sum --check image-archive-sha256.txt
          original="$(cat built-image-id.txt)"
          test -s aba-runtime-image.tar.gz
          docker load -i aba-runtime-image.tar.gz
          restored="$(docker image inspect --format '{{.Id}}' aba-ci-security:local)"
          test "$original" = "$restored"
          echo "PASS: Docker archive matches the previously scanned image"
      - name: Attest OCI archive after every upstream gate succeeded
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/oci-provenance/aba-runtime-image.tar.gz
      - name: Verify gated OCI signature, source commit and tamper rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/verify_attested_artifact.sh \
            artifacts/oci-provenance/aba-runtime-image.tar.gz \
            artifacts/provenance/verified-oci-archive-attestation.json
      - name: Preserve signed release integrity verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-template-provenance-verification
          path: artifacts/provenance/
          if-no-files-found: error
