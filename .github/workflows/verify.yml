name: Verify ABA Framework and Generic API
on:
  push:
  pull_request:
jobs:
  governance-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regressions for AI planner/QA runner
        run: python3 scripts/test_task_protocol.py
      - name: Recorded QA gates (includes architecture, AI checks, .NET build and C# smoke)
        run: |
          python3 scripts/task_protocol.py verify --profile all \
            --output artifacts/verification/ci.json \
            --markdown artifacts/verification/ci.md
      - name: Prove development HTTP host starts and completes API demo
        run: bash scripts/verify-http.sh
      - name: Validate generic starter template metadata
        run: python3 scripts/test_starter_template.py
      - name: Generate, build, test and start a clean generic API
        run: bash scripts/verify-starter.sh
      - name: Upload QA evidence (including failed/incomplete runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-verification-evidence
          path: artifacts/verification/
          if-no-files-found: warn

  integration-relational-and-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aba_ci
          POSTGRES_USER: aba_ci
          POSTGRES_PASSWORD: aba-ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aba_ci -d aba_ci"
          --health-interval 3s --health-timeout 3s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Aba_CiOnly_2026!"
        ports:
          - 1433:1433
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify real PostgreSQL, SQL Server and Redis with generated project
        env:
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_SQLSERVER: "Server=localhost,1433;Database=aba_ci;User Id=sa;Password=Aba_CiOnly_2026!;TrustServerCertificate=True"
          ABA_TEST_REDIS: "localhost:6379,abortConnect=false"
        run: |
          bash scripts/verify-platform-services.sh

  container-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run fresh generic API Docker image
        run: bash scripts/verify-container-starter.sh

  package-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack and install versioned .NET template package
        run: bash scripts/pack-template.sh
      - name: Upload installable NuGet template package
        uses: actions/upload-artifact@v4
        with:
          name: aba-dotnet-template-nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  keycloak-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real Keycloak OIDC, JWKS and tenant 204/401/403
        run: bash scripts/verify-keycloak-oidc.sh
