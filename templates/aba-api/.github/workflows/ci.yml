name: ABA API - Build, Unit Tests and Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests for the ABA task and architecture protocol
        run: python3 tools/test_aba_task.py
      - name: Verify context ownership, restore, build and xUnit
        run: python3 tools/aba_task.py verify --level build --output artifacts/verification/default.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-api-verification
          path: artifacts/verification/
          if-no-files-found: warn
