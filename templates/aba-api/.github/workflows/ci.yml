name: ABA API - Build, Unit Tests and Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests for the ABA task and architecture protocol
        run: python3 tools/test_aba_task.py
      - name: Verify context ownership, restore, build and xUnit
        run: python3 tools/aba_task.py verify --level build --output artifacts/verification/default.json
      - name: Negative regressions for NuGet supply-chain gate
        run: python3 tools/test_supply_chain.py
      - name: Fail closed on direct/transitive NuGet vulnerabilities and generate SPDX
        run: |
          mkdir -p artifacts/supply-chain
          dotnet package list --project Aba.Starter.slnx \
            --include-transitive --vulnerable --format json --output-version 1 --no-restore \
            > artifacts/supply-chain/audit.json
          python3 tools/supply_chain.py --root . --solution Aba.Starter.slnx \
            --audit-json artifacts/supply-chain/audit.json \
            --output artifacts/supply-chain/sbom.spdx.json
      - name: Audit optional real-service test project dependencies separately
        run: |
          dotnet restore tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj
          dotnet package list --project tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            --include-transitive --vulnerable --format json --output-version 1 --no-restore \
            > artifacts/supply-chain/integration-audit.json
          python3 tools/supply_chain.py --root . \
            --project tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            --audit-json artifacts/supply-chain/integration-audit.json \
            --output artifacts/supply-chain/integration.spdx.json
      - name: Upload NuGet vulnerability audit and SPDX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-api-nuget-sbom
          path: artifacts/supply-chain/
          if-no-files-found: warn
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-api-verification
          path: artifacts/verification/
          if-no-files-found: warn


  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the generated API runtime image
        run: |
          mkdir -p artifacts/container
          docker build --pull -t aba-generated-security:local .
          docker image inspect --format '{{.Id}}' aba-generated-security:local \
            > artifacts/container/built-image-id.txt
      - name: Fail on fixable CRITICAL container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aba-generated-security:local
          vuln-type: os,library
          format: json
          output: artifacts/container/trivy.json
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
      - name: Preserve runtime image vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-api-image-security
          path: artifacts/container/
          if-no-files-found: warn
