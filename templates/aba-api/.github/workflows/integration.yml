name: ABA API - Real PostgreSQL, SQL Server, Redis, RabbitMQ, Kafka and Wolverine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-restart:
    # Manually dispatched alongside the other integration cases; only the
    # disposable CI-owned Redis service will be stopped and restarted.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate actual Redis shutdown, fail-closed fallback and recovery
        env:
          CI: "true"
          ABA_ENABLE_REDIS_RESTART_DRILL: "yes"
          ABA_TEST_REDIS: "localhost:6379,abortConnect=false"
          ABA_TEST_REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          dotnet test tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --filter 'Category=RedisRestartDrill' \
            --logger 'console;verbosity=normal'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aba_ci
          POSTGRES_USER: aba_ci
          POSTGRES_PASSWORD: aba-ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aba_ci -d aba_ci"
          --health-interval 3s --health-timeout 3s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Aba_CiOnly_2026!"
        ports:
          - 1433:1433
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: aba_ci
          RABBITMQ_DEFAULT_PASS: aba-ci-local-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
          --label aba.test.disposable=true
      kafka:
        image: apache/kafka:4.4.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        ports:
          - 9092:9092
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --label aba.test.disposable=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate both live SQL providers, Redis, RabbitMQ, Kafka, Wolverine and tenant isolation
        env:
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_SQLSERVER: "Server=localhost,1433;Database=aba_ci;User Id=sa;Password=Aba_CiOnly_2026!;TrustServerCertificate=True"
          ABA_TEST_REDIS: "localhost:6379,abortConnect=false"
          ABA_TEST_RABBITMQ: "amqp://aba_ci:aba-ci-local-only@localhost:5672/%2F"
          ABA_TEST_KAFKA: "localhost:9092"
        run: python3 tools/aba_task.py verify --level full --output artifacts/verification/integration.json
      - name: Pause and recover only the disposable CI RabbitMQ service
        env:
          CI: "true"
          ABA_ENABLE_BROKER_OUTAGE_DRILL: "yes"
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_RABBITMQ: "amqp://aba_ci:aba-ci-local-only@localhost:5672/%2F"
          ABA_TEST_RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          dotnet test tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --no-build --filter 'Category=BrokerOutageDrill' \
            --logger 'console;verbosity=normal'
      - name: Destructive drills only against disposable local CI databases
        env:
          CI: "true"
          ABA_ENABLE_DESTRUCTIVE_CI_DRILLS: "yes"
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_SQLSERVER: "Server=localhost,1433;Database=aba_ci;User Id=sa;Password=Aba_CiOnly_2026!;TrustServerCertificate=True"
        run: |
          dotnet test tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --no-build --filter 'Category=RecoveryDrill' \
            --logger 'console;verbosity=normal'
      - name: Kill real disposable .NET child processes at crash boundaries
        env:
          CI: "true"
          ABA_ENABLE_DESTRUCTIVE_CI_DRILLS: "yes"
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_SQLSERVER: "Server=localhost,1433;Database=aba_ci;User Id=sa;Password=Aba_CiOnly_2026!;TrustServerCertificate=True"
        run: |
          dotnet test tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --no-build --filter 'Category=CrashDrill' \
            --logger 'console;verbosity=normal'
      - name: Kill the outbox producer during RabbitMQ outage and recover
        env:
          CI: "true"
          ABA_ENABLE_DESTRUCTIVE_CI_DRILLS: "yes"
          ABA_ENABLE_BROKER_OUTAGE_DRILL: "yes"
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_RABBITMQ: "amqp://aba_ci:aba-ci-local-only@localhost:5672/%2F"
          ABA_TEST_RABBITMQ_CONTAINER_ID: ${{ job.services.rabbitmq.id }}
        run: |
          dotnet test tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --no-build --filter 'Category=BrokerCrashDrill' \
            --logger 'console;verbosity=normal'
      - name: Upload integration verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-api-integration-evidence
          path: artifacts/verification/
          if-no-files-found: warn
