name: ABA API - Real PostgreSQL, SQL Server, Redis and Wolverine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aba_ci
          POSTGRES_USER: aba_ci
          POSTGRES_PASSWORD: aba-ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aba_ci -d aba_ci"
          --health-interval 3s --health-timeout 3s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Aba_CiOnly_2026!"
        ports:
          - 1433:1433
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native PostgreSQL recovery clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Validate both live SQL providers, Redis, Wolverine and tenant isolation
        env:
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_SQLSERVER: "Server=localhost,1433;Database=aba_ci;User Id=sa;Password=Aba_CiOnly_2026!;TrustServerCertificate=True"
          ABA_TEST_REDIS: "localhost:6379,abortConnect=false"
        run: python3 tools/aba_task.py verify --level full --output artifacts/verification/integration.json
      - name: Destructive drills only against disposable local CI databases
        env:
          CI: "true"
          ABA_ENABLE_DESTRUCTIVE_CI_DRILLS: "yes"
          ABA_TEST_POSTGRESQL: "Host=localhost;Port=5432;Database=aba_ci;Username=aba_ci;Password=aba-ci-local-only"
          ABA_TEST_SQLSERVER: "Server=localhost,1433;Database=aba_ci;User Id=sa;Password=Aba_CiOnly_2026!;TrustServerCertificate=True"
        run: |
          dotnet test tests/Aba.Starter.Platform.IntegrationTests/Aba.Starter.Platform.IntegrationTests.csproj \
            -c Release --no-build --filter 'Category=RecoveryDrill' \
            --logger 'console;verbosity=normal'
      - name: Upload integration verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aba-api-integration-evidence
          path: artifacts/verification/
          if-no-files-found: warn
